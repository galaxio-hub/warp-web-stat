# warp-engine：nginx 统计/告警输出
# 命中输出窗 nginx_alerts（统计行与 5xx 突发告警都在其中，用 alert_type 区分）
[sink_group]
name = "nginx_out"
windows = ["nginx_alerts"]
wf_meta_disable = ["__wfu_id", "__wfu_entity_id"]

[[sink_group.sinks]]
connect = "file_json_sink"
name = "nginx_file"

[sink_group.sinks.params]
base = "data/alerts"
file = "nginx.ndjson"
