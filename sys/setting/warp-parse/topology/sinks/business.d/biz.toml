# 系统 web-stats 自己的业务 sink —— 集成时整份替换模块默认的 biz.toml
[sink_group]
name = "biz"
oml = ["*"]
tags = ["biz:biz", "sys:web-stats"]
batch_size = 2048
batch_timeout_ms = 300

[[sink_group.sinks]]
name = "sys-json"
connect = "file_json_sink"
tags = ["sink:json"]

[sink_group.sinks.params]
file = "biz_sys.json"
