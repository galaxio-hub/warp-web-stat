<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>warp-engine · nginx 日志统计</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#26303d;
    --fg:#e6edf3; --muted:#8b98a5; --accent:#4da3ff; --ok:#3fb950;
    --warn:#d29922; --bad:#f85149; --accent2:#a371f7;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--fg);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  a{color:var(--accent)}
  header{
    position:sticky; top:0; z-index:10;
    background:rgba(13,17,23,.94); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); padding:12px 20px;
    display:flex; gap:12px; align-items:center; flex-wrap:wrap;
  }
  header h1{font-size:15px; margin:0 6px 0 0; font-weight:650; white-space:nowrap}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--muted); flex:0 0 auto}
  .dot.ok{background:var(--ok); box-shadow:0 0 0 3px rgba(63,185,80,.16)}
  .dot.err{background:var(--bad); box-shadow:0 0 0 3px rgba(248,81,73,.16)}
  .muted{color:var(--muted)}
  .spacer{flex:1 1 auto}
  input[type=text]{
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:5px 8px; font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  input[type=text]{min-width:340px; flex:1 1 340px}
  button{
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:5px 10px; cursor:pointer; font-size:12px;
  }
  button:hover{border-color:var(--accent)}
  main{padding:18px 20px 48px; max-width:1400px; margin:0 auto}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px}
  .card .k{font-size:12px; color:var(--muted); margin-bottom:6px; white-space:nowrap}
  .card .v{font-size:24px; font-weight:650; font-variant-numeric:tabular-nums; letter-spacing:.2px}
  .card .s{font-size:11px; color:var(--muted); margin-top:2px}
  .card.bad .v{color:var(--bad)}
  .card.warn .v{color:var(--warn)}
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(420px,1fr)); gap:12px; margin-bottom:12px}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px; overflow:hidden}
  .panel h2{font-size:13px; margin:0 0 12px; font-weight:600; color:#c9d4e0}
  .panel h2 .sub{font-weight:400; color:var(--muted); margin-left:8px; font-size:12px}
  table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
  th,td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); font-size:13px}
  th{color:var(--muted); font-weight:500; font-size:12px; position:sticky; top:0; background:var(--panel)}
  td.num,th.num{text-align:right}
  tbody tr:hover{background:rgba(77,163,255,.06)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px}
  .scroll{max-height:340px; overflow:auto}
  .bar{display:grid; grid-template-columns:64px 1fr 84px 62px; gap:10px; align-items:center; padding:5px 0}
  .bar .code{font-family:ui-monospace,Menlo,monospace; text-align:center; border-radius:5px; padding:2px 0; font-size:12px}
  .code.c2{background:rgba(63,185,80,.16); color:#56d364}
  .code.c3{background:rgba(77,163,255,.16); color:#79c0ff}
  .code.c4{background:rgba(210,153,34,.16); color:#e3b341}
  .code.c5{background:rgba(248,81,73,.16); color:#ff7b72}
  .bar .track{background:var(--panel2); border-radius:4px; height:14px; overflow:hidden}
  .bar .fill{height:100%; border-radius:4px; background:linear-gradient(90deg,#2f81f7,#4da3ff)}
  .bar .fill.bad{background:linear-gradient(90deg,#b62324,#f85149)}
  .bar .v,.bar .p{font-variant-numeric:tabular-nums; font-size:12px; color:var(--muted); text-align:right}
  .empty{color:var(--muted); font-size:13px; padding:6px 0}
  .banner{background:rgba(248,81,73,.1); border:1px solid rgba(248,81,73,.35); color:#ffa198;
          border-radius:8px; padding:10px 12px; margin-bottom:14px; font-size:13px; display:none}
  .banner.show{display:block}
  .banner .mono{color:#ffc9c2}
  .range{display:flex; gap:18px; flex-wrap:wrap; color:var(--muted); font-size:12px; padding-top:4px}
  .pill{display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px; margin-left:6px;
        background:rgba(163,113,247,.16); color:#c9a9ff}
  footer{margin-top:18px; color:var(--muted); font-size:12px}
  kbd{background:var(--panel2); border:1px solid var(--line); border-radius:4px; padding:1px 5px; font-size:11px}
</style>
</head>
<body>
<header>
  <span id="dot" class="dot"></span>
  <h1>warp-engine · nginx 日志统计</h1>
  <span id="status" class="muted">等待数据…</span>
  <span class="spacer"></span>
  <span class="muted">数据文件</span>
  <input type="text" id="path" spellcheck="false">
  <button id="reload">立即刷新</button>
  <button id="pick">选择本地文件…</button>
  <input type="file" id="file" accept=".ndjson,.json,.jsonl,.txt" style="display:none">
  <span id="updated" class="muted"></span>
</header>

<main>
  <div id="banner" class="banner"></div>
  <section class="cards" id="cards"></section>

  <section class="grid">
    <div class="panel">
      <h2>状态码分布 <span class="sub" id="statusSub"></span></h2>
      <div id="statusBars"></div>
    </div>
    <div class="panel">
      <h2>客户端 IP <span class="sub" id="ipSub"></span></h2>
      <div class="scroll"><div id="ipTable"></div></div>
    </div>
  </section>

  <div class="panel">
    <h2>5xx 突发告警 <span class="sub" id="surgeSub"></span></h2>
    <div class="scroll"><div id="surgeTable"></div></div>
  </div>

  <footer>
    输出文件：<span class="mono" id="fileinfo">-</span>
    <div class="range" id="range"></div>
  </footer>
</main>

<script>
(function () {
  "use strict";

  // 默认数据文件：相对 sys/ 根目录（由 serve.sh 提供静态服务）
  // 兼容 gops 1.3.5 新布局（sys/<model>/mods/<mod>/）与旧布局（sys/mods/<mod>/<model>/）
  var PATHS = [
    "../arm-mac14-host/mods/warp-fusion/local/data/alerts/nginx.ndjson",
    "../mods/warp-fusion/arm-mac14-host/local/data/alerts/nginx.ndjson"
  ];
  var REFRESH_MS = 3000;
  var TOP_IP = 20;
  var TOP_SURGE = 50;

  var $ = function (id) { return document.getElementById(id); };
  var timer = null;
  var localText = null;   // 从本地文件读入时，直接用其内容

  function num(v) {
    if (v === null || v === undefined) return null;
    var n = Number(v);
    return isFinite(n) ? n : null;
  }
  function int(v) {
    var n = num(v);
    return n === null ? 0 : Math.round(n);
  }
  function fmtInt(n) { return n.toLocaleString("en-US"); }
  function pct(part, whole) {
    if (!whole) return "0%";
    return (part * 100 / whole).toFixed(part * 100 / whole < 10 && part !== whole ? 1 : 1) + "%";
  }
  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function shortTime(ts) {
    if (!ts) return "-";
    var d = new Date(ts);
    if (isNaN(d.getTime())) return String(ts);
    return d.toISOString().replace("T", " ").replace("Z", "").slice(0, 19);
  }

  // ---- 兼容：若结构化字段缺失（旧数据），回退解析 detail 文本 ----
  function fromDetail(rule, detail) {
    var d = String(detail || "");
    var m;
    if (rule === "nginx_status_stats" && (m = d.match(/status=(\S+)\s+total=(\S+)\s+clients=(\S+)\s+5xx=(\S+)/))) {
      return { http_status: m[1], total: num(m[2]), clients: num(m[3]), total_5xx: num(m[4]) };
    }
    if (rule === "nginx_ip_stats" && (m = d.match(/ip=(\S+)\s+hits=(\S+)\s+5xx=(\S+)/))) {
      return { client_ip: m[1], hits: num(m[2]), hit_5xx: num(m[3]) };
    }
    if (rule === "http_5xx_surge" && (m = d.match(/client_ip=(\S+)\s+uri=(.*)$/))) {
      return { client_ip: m[1], uri: m[2] };
    }
    return {};
  }

  function rowsFromText(text) {
    var rows = [];
    var lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      var t = lines[i].trim();
      if (!t) continue;
      try { rows.push(JSON.parse(t)); } catch (e) { /* 跳过坏行 */ }
    }
    return rows;
  }

  function aggregate(rows) {
    var status = {};        // code -> {total, five}
    var ip = {};            // ip -> {hits, five}
    var surge = [];
    var buckets = {};
    var times = [];
    var totalReq = 0, total5xx = 0;

    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var rule = r.__wfu_rule_name || "";
      var at = r.__wfu_fired_at || r.__wfu_emit_time || "";
      var f = null;

      if (rule === "nginx_status_stats") {
        f = (r.http_status !== undefined) ? r : fromDetail(rule, r.detail);
        var code = String(f.http_status === undefined ? "-" : f.http_status);
        var e = status[code] || (status[code] = { total: 0, five: 0 });
        e.total += int(f.total);
        e.five += int(f.total_5xx);
        totalReq += int(f.total);
        total5xx += int(f.total_5xx);
        if (at) { buckets[at] = 1; times.push(at); }
      } else if (rule === "nginx_ip_stats") {
        f = (r.client_ip !== undefined) ? r : fromDetail(rule, r.detail);
        var k = String(f.client_ip === undefined ? "-" : f.client_ip);
        var g = ip[k] || (ip[k] = { hits: 0, five: 0 });
        g.hits += int(f.hits);
        g.five += int(f.hit_5xx);
      } else if (rule === "http_5xx_surge") {
        f = (r.uri !== undefined) ? r : fromDetail(rule, r.detail);
        surge.push({ at: at, ip: String(f.client_ip === undefined ? "-" : f.client_ip), uri: String(f.uri || "-") });
        if (at) times.push(at);
      }
    }
    times.sort();
    return {
      status: status, ip: ip, surge: surge,
      bucketCount: Object.keys(buckets).length,
      totalReq: totalReq, total5xx: total5xx,
      clientCount: Object.keys(ip).length,
      first: times.length ? times[0] : "", last: times.length ? times[times.length - 1] : ""
    };
  }

  function cardsHtml(a) {
    var items = [
      { k: "累计请求", v: fmtInt(a.totalReq), s: "各桶 × 状态码统计求和" },
      { k: "累计 5xx", v: fmtInt(a.total5xx), s: "http_status = 500", cls: a.total5xx ? "bad" : "" },
      { k: "5xx 占比", v: a.totalReq ? pct(a.total5xx, a.totalReq) : "-", s: "累计 5xx / 累计请求" },
      { k: "独立客户端", v: fmtInt(a.clientCount), s: "按来源 IP 去重", cls: "warn" },
      { k: "统计桶数", v: fmtInt(a.bucketCount), s: "5s 固定桶，已关闭" },
      { k: "5xx 突发告警", v: fmtInt(a.surge.length), s: "同 IP 1 分钟 ≥3 次", cls: a.surge.length ? "bad" : "" }
    ];
    var h = "";
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      h += '<div class="card ' + (it.cls || "") + '"><div class="k">' + esc(it.k) + '</div>' +
           '<div class="v">' + esc(it.v) + '</div><div class="s">' + esc(it.s) + '</div></div>';
    }
    return h;
  }

  function codeClass(code) {
    if (/^5/.test(code)) return "c5";
    if (/^4/.test(code)) return "c4";
    if (/^3/.test(code)) return "c3";
    if (/^2/.test(code)) return "c2";
    return "";
  }

  function statusHtml(a) {
    var codes = Object.keys(a.status);
    if (!codes.length) return '<div class="empty">暂无统计行（等待第一个 5s 桶关闭）</div>';
    codes.sort(function (x, y) {
      var nx = num(x), ny = num(y);
      if (nx !== null && ny !== null && nx !== ny) return nx - ny;
      return String(x) < String(y) ? -1 : 1;
    });
    var max = 1;
    codes.forEach(function (c) { if (a.status[c].total > max) max = a.status[c].total; });

    var h = "";
    codes.forEach(function (c) {
      var e = a.status[c];
      var w = Math.max(1, Math.round(e.total * 100 / max));
      var cls = codeClass(c);
      h += '<div class="bar">' +
             '<div class="code ' + cls + '">' + esc(c) + '</div>' +
             '<div class="track"><div class="fill' + (/^5/.test(c) ? " bad" : "") + '" style="width:' + w + '%"></div></div>' +
             '<div class="v">' + fmtInt(e.total) + '</div>' +
             '<div class="p">' + (e.five ? ('5xx ' + fmtInt(e.five)) : pct(e.total, a.totalReq)) + '</div>' +
           '</div>';
    });
    return h;
  }

  function ipHtml(a) {
    var keys = Object.keys(a.ip);
    if (!keys.length) return '<div class="empty">暂无按 IP 的统计行</div>';
    keys.sort(function (x, y) { return a.ip[y].hits - a.ip[x].hits; });
    var shown = keys.slice(0, TOP_IP);
    var h = '<table><thead><tr><th>客户端 IP</th><th class="num">请求数</th><th class="num">5xx</th><th class="num">5xx 占比</th></tr></thead><tbody>';
    shown.forEach(function (k) {
      var e = a.ip[k];
      h += '<tr><td class="mono">' + esc(k) + '</td>' +
           '<td class="num">' + fmtInt(e.hits) + '</td>' +
           '<td class="num"' + (e.five ? ' style="color:var(--bad)"' : '') + '>' + fmtInt(e.five) + '</td>' +
           '<td class="num">' + pct(e.five, e.hits) + '</td></tr>';
    });
    h += '</tbody></table>';
    if (keys.length > shown.length) {
      h += '<div class="empty">仅显示前 ' + shown.length + ' 个（共 ' + keys.length + '）</div>';
    }
    return h;
  }

  function surgeHtml(a) {
    if (!a.surge.length) return '<div class="empty">暂无 5xx 突发告警</div>';
    var list = a.surge.slice().sort(function (x, y) { return String(y.at) < String(x.at) ? -1 : 1; });
    var shown = list.slice(0, TOP_SURGE);
    var h = '<table><thead><tr><th>时间</th><th>客户端 IP</th><th>URI</th></tr></thead><tbody>';
    shown.forEach(function (s) {
      h += '<tr><td class="mono">' + esc(shortTime(s.at)) + '</td>' +
           '<td class="mono">' + esc(s.ip) + '</td>' +
           '<td class="mono">' + esc(s.uri) + '</td></tr>';
    });
    h += '</tbody></table>';
    if (list.length > shown.length) {
      h += '<div class="empty">仅显示最近 ' + shown.length + ' 条（共 ' + list.length + '）</div>';
    }
    return h;
  }

  function render(text, source) {
    var rows = rowsFromText(text);
    var a = aggregate(rows);
    $("cards").innerHTML = cardsHtml(a);
    $("statusBars").innerHTML = statusHtml(a);
    $("statusSub").textContent = "共 " + Object.keys(a.status).length + " 种";
    var warned = 0;
    Object.keys(a.status).forEach(function (c) { if (/^5/.test(c)) warned += a.status[c].total; });
    $("ipTable").innerHTML = ipHtml(a);
    $("ipSub").textContent = Object.keys(a.ip).length + " 个 IP";
    $("surgeTable").innerHTML = surgeHtml(a);
    $("surgeSub").textContent = a.surge.length ? (a.surge.length + " 条") : "";
    $("fileinfo").textContent = source;
    $("range").innerHTML =
      '<span>事件时间范围：<span class="mono">' + esc(shortTime(a.first) || "-") + '</span> → <span class="mono">' + esc(shortTime(a.last) || "-") + '</span></span>' +
      '<span>解析行数：' + fmtInt(rows.length) + '</span>' +
      '<span>统计/告警/突发：' + fmtInt(countBy(rows, "nginx_status_stats")) + ' / ' +
        fmtInt(countBy(rows, "nginx_ip_stats")) + ' / ' + fmtInt(countBy(rows, "http_5xx_surge")) + '</span>';
    return rows.length;
  }

  function countBy(rows, rule) {
    var n = 0;
    for (var i = 0; i < rows.length; i++) if (rows[i].__wfu_rule_name === rule) n++;
    return n;
  }

  function showBanner(msg) {
    var b = $("banner");
    if (!msg) { b.className = "banner"; b.innerHTML = ""; return; }
    b.className = "banner show";
    b.innerHTML = msg;
  }

  async function refresh() {
    if (localText !== null) {
      try {
        var n = render(localText, "（本地文件）");
        dot(true, "本地文件 · " + fmtInt(n) + " 行");
        $("updated").textContent = "更新于 " + new Date().toLocaleTimeString();
        showBanner("");
      } catch (e) { dot(false, String(e)); }
      return;
    }
    var path = $("path").value.trim();
    var cands = path ? [path] : PATHS;
    var err = null;
    for (var i = 0; i < cands.length; i++) {
      try {
        var res = await fetch(cands[i], { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status + " " + res.statusText);
        var text = await res.text();
        var n = render(text, cands[i]);
        if ($("path").value.trim() !== cands[i]) $("path").value = cands[i];
        dot(true, "已连接 · " + fmtInt(n) + " 行");
        $("updated").textContent = "更新于 " + new Date().toLocaleTimeString();
        showBanner("");
        return;
      } catch (e) { err = e; }
    }
    dot(false, "读取失败");
    showBanner("读取数据失败：<span class='mono'>" + esc(err ? err.message : "-") + "</span><br>" +
      "已按顺序尝试：<span class='mono'>" + esc(cands.join("  →  ")) + "</span><br>" +
      "请确认 warp-fusion 正在运行并已产出该文件；或在 <span class='mono'>sys/</span> 目录下执行 <span class='mono'>sh view/serve.sh</span> 后访问本页。" +
      "也可点右上角「选择本地文件…」或把 ndjson 拖进来。");
  }

  function dot(ok, text) {
    var d = $("dot");
    d.className = "dot " + (ok ? "ok" : "err");
    $("status").textContent = text;
  }

  function start() {
    if (timer) clearInterval(timer);
    timer = setInterval(function () { if (!document.hidden) refresh(); }, REFRESH_MS);
  }

  // ---- 事件绑定 ----
  $("reload").addEventListener("click", refresh);
  $("path").addEventListener("change", function () { localText = null; refresh(); });
  $("pick").addEventListener("click", function () { $("file").click(); });
  $("file").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { localText = String(r.result || ""); refresh(); };
    r.readAsText(f);
  });
  document.addEventListener("dragover", function (e) { e.preventDefault(); });
  document.addEventListener("drop", function (e) {
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { localText = String(r.result || ""); refresh(); };
    r.readAsText(f);
  });

  // ---- 启动 ----
  $("path").value = PATHS[0];
  refresh();
  start();
})();
</script>
</body>
</html>
